apiVersion: v1
kind: ConfigMap
metadata:
  name: agentboard-config
  labels:
    app.kubernetes.io/name: agentboard
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  PHX_SERVER: "true"
  PORT: "4000"
  # Trusted internal network default: auth modes stay off (private network).
  # Opt in to Internet exposure via agent API enforcement and Cloudflare Access
  # frontend authentication (see docs/setup/agent-api-tokens.md and
  # docs/setup/frontend-auth.md).
  AGENTBOARD_AUTH_MODE: "off"
  DATABASE_HOST: agentboard-db-rw
  DATABASE_NAME: agentboard
  DATABASE_PORT: "5432"
  POOL_SIZE: "10"
  # Inventory catch-up only; enable explicitly after deploying schema 7.
  AGENTBOARD_PR_DISCOVERY_ENABLED: "false"
  AGENTBOARD_PR_OBSERVATION_ENABLED: "false"
  AGENTBOARD_PUBLICATION_RECOVERY_ENABLED: "false"
  DATABASE_CA_FILE: /etc/agentboard/db-ca/ca.crt
  RELEASE_TMP: /tmp/agentboard
  RELEASE_DISTRIBUTION: none
