name: Publish verified agentboard release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag pointing to the approved commit (v0.1.0)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: agentboard-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: arc-runner-set
    environment: agentboard-release
    container:
      image: registry.carverauto.dev/serviceradar/buildbuddy-workflow-runner:v1.0.24.5@sha256:7f64c7cdf563c032ed7c5546eb9e4492cd527df64a615b55788fc518aa8752dd
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate release selection
        shell: bash
        run: |
          set -euo pipefail
          # ARC's container checkout is owned by the runner, not the job UID.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$RELEASE_TAG" = v0.1.0
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - name: Configure remote execution
        run: ./scripts/ci-bazelrc
      - name: Install pinned build driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agentboard-tools
          curl -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64 -o /tmp/agentboard-tools/bazel
          echo 'e1508323f347ad1465a887bc5d2bfb91cffc232d11e8e997b623227c6b32fb76  /tmp/agentboard-tools/bazel' | sha256sum -c -
          chmod +x /tmp/agentboard-tools/bazel
          echo /tmp/agentboard-tools >> "$GITHUB_PATH"
      - name: Install pinned publication client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agentboard-tools
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.21.7/go-containerregistry_Linux_x86_64.tar.gz -o /tmp/agentboard-tools/crane.tar.gz
          echo '1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230  /tmp/agentboard-tools/crane.tar.gz' | sha256sum -c -
          tar -xzf /tmp/agentboard-tools/crane.tar.gz -C /tmp/agentboard-tools crane
          curl -fsSL https://github.com/cli/cli/releases/download/v2.65.0/gh_2.65.0_linux_amd64.tar.gz -o /tmp/agentboard-tools/gh.tar.gz
          echo '762569efe785082b7d1feb06995efece1a9cecce16da8503ac6fdbcbea04085b  /tmp/agentboard-tools/gh.tar.gz' | sha256sum -c -
          tar -xzf /tmp/agentboard-tools/gh.tar.gz -C /tmp/agentboard-tools --strip-components=2 gh_2.65.0_linux_amd64/bin/gh
      - name: Authenticate mirrored base image
        shell: bash
        env:
          HARBOR_BUILD_USERNAME: ${{ secrets.HARBOR_BUILD_USERNAME }}
          HARBOR_BUILD_PASSWORD: ${{ secrets.HARBOR_BUILD_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_BUILD_PASSWORD" | /tmp/agentboard-tools/crane auth login registry.carverauto.dev --username "$HARBOR_BUILD_USERNAME" --password-stdin
      - name: Test and package on BuildBuddy
        run: |
          ./scripts/bazel test --config=ci //:acceptance
          ./scripts/bazel build --config=ci --remote_download_toplevel //:release_artifacts
      - name: Publish immutable image and release assets
        shell: bash
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release
