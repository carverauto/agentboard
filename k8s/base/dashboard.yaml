apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentboard-dashboard
  labels:
    app.kubernetes.io/name: agentboard
    app.kubernetes.io/component: dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agentboard
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentboard
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: agentboard
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: agentboard-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          # Set the real image (ideally by digest) in your overlay's `images:`.
          image: registry.carverauto.dev/agentboard/dashboard:build-required
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: agentboard-config
          env:
            - name: AGENTBOARD_CAPTAIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentboard-app
                  key: captain-token
                  optional: true
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: agentboard-db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentboard-db-credentials
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: agentboard-app
                  key: secret-key-base
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentboard-app
                  key: database-url
                  optional: true
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/agentboard/db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: db-ca
          secret:
            secretName: agentboard-db-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: agentboard-dashboard
  labels:
    app.kubernetes.io/name: agentboard
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: agentboard
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 4000
      targetPort: http
