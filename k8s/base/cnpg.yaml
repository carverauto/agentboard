apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agentboard-db
  labels:
    app.kubernetes.io/name: agentboard
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Argo CD never prunes or deletes this resource: it holds data.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # Dedicated CNPG Cluster for agentboard (not a database on a shared instance).
  instances: 2
  # Remotely verified PostgreSQL18.6 + WAL-backed BM25; existing databases need operator extension DDL.
  imageName: registry.carverauto.dev/agentboard/postgres:18.6-bm25-1.5.1-7c20962@sha256:90ea5695afde3d2d56128baad84bd775b3121cf18d9830974910105aa08e3356
  imagePullSecrets:
    - name: agentboard-registry
  enableSuperuserAccess: false
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: agentboard
      owner: agentboard
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS pg_textsearch VERSION '1.5.1';"
      secret:
        name: agentboard-db-credentials
  managed:
    roles:
      - name: agentboard
        ensure: present
        login: true
        passwordSecret:
          name: agentboard-db-credentials
  postgresql:
    shared_preload_libraries: [pg_textsearch]
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
      pg_textsearch.memory_limit: 64MB
      password_encryption: scram-sha-256
    pg_hba:
      - hostssl all all all scram-sha-256
      - hostnossl all all all reject
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
