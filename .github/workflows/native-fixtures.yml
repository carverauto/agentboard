name: Native bridge fixtures
on:
  pull_request:
    branches: [main]
    paths:
      - internal/worker/**
      - internal/nativequeue/codex/**
      - internal/nativequeue/owner/**
      - build/integration/*native*
      - build/integration/codex_queue_test.*
      - build/integration/codex_rpc_client_test.*
      - build/integration/codex_rpc_socket_test.mjs
      - build/integration/codex_owner_control_test.mjs
      - build/integration/BUILD.bazel
      - BUILD.bazel
      - MODULE.bazel
      - .github/workflows/native-fixtures.yml
  push:
    branches: [main]
    paths:
      - internal/worker/**
      - internal/nativequeue/codex/**
      - internal/nativequeue/owner/**
      - build/integration/*native*
      - build/integration/codex_queue_test.*
      - build/integration/codex_rpc_client_test.*
      - build/integration/codex_rpc_socket_test.mjs
      - build/integration/codex_owner_control_test.mjs
      - build/integration/BUILD.bazel
      - BUILD.bazel
      - MODULE.bazel
      - .github/workflows/native-fixtures.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-fixtures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-fixtures:
    # These existing contract fixtures need Unix sockets and child processes,
    # but no installed coding agents, API credentials, or compiled artifacts.
    # Full packaged acceptance remains on BuildBuddy via --config=ci.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      # Match the worker_node_linux_x64 archive in MODULE.bazel.
      GO_VERSION: 1.24.2
      GO_SHA256: 68097bd680839cbc9d464a0edce4f7c333975e27a90246890e9f1078c7e702ad
      NODE_VERSION: 22.23.2
      NODE_SHA256: d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307
      # Match @codex_rpc_ws and internal/nativequeue/codex/package-lock.json.
      CODEX_RPC_WS_VERSION: 8.22.0
      CODEX_RPC_WS_SHA256: ca9b3798b2e11ce8fac6713f50ef0501aa12b09b330623c1dc409dff94e7abc8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-pinned Node
        run: |
          set -euo pipefail
          archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          echo "${NODE_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/node-v${NODE_VERSION}-linux-x64/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/node-v${NODE_VERSION}-linux-x64/bin/node" --version
      - name: Test Pi native bridge fixture
        run: |
          set -euo pipefail
          node build/integration/pi_native_test.mjs \
            "${GITHUB_WORKSPACE}/internal/worker/pi-native.mjs"
      - name: Test Claude native bridge fixture
        run: |
          set -euo pipefail
          node build/integration/claude_native_test.mjs \
            "${GITHUB_WORKSPACE}/internal/worker/claude-native"
      - name: Test Codex native bridge fixture
        run: |
          set -euo pipefail
          node build/integration/codex_native_test.mjs \
            "${GITHUB_WORKSPACE}/internal/worker/codex-native.mjs" \
            "${GITHUB_WORKSPACE}/build/integration/codex_native_fixture.mjs"
      - name: Test Codex native queue fixture
        run: |
          set -euo pipefail
          node build/integration/codex_queue_test.mjs \
            "${GITHUB_WORKSPACE}/internal/nativequeue/codex/transport.mjs"
      - name: Test Codex RPC client with checksum-pinned ws
        env:
          CODEX_RPC_TEST_UNIX: "1"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ws-${CODEX_RPC_WS_VERSION}.tgz"
          curl -fsSL "https://registry.npmjs.org/ws/-/ws-${CODEX_RPC_WS_VERSION}.tgz" -o "$archive"
          echo "${CODEX_RPC_WS_SHA256}  ${archive}" | sha256sum -c -
          bash build/integration/codex_rpc_client_test.sh \
            "${GITHUB_WORKSPACE}/internal/nativequeue/codex/rpc-client.mjs" \
            "$(command -v node)" "$archive"

      - name: Test Go owner with real inherited native socket and owner pipes
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/go${GO_VERSION}.linux-amd64.tar.gz"
          curl -fsSL "https://dl.google.com/go/go${GO_VERSION}.linux-amd64.tar.gz" -o "$archive"
          echo "${GO_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "${RUNNER_TEMP}"
          export OWNER_INTEGRATION=1
          export OWNER_NODE="$(command -v node)"
          export OWNER_WS_ARCHIVE="${RUNNER_TEMP}/ws-${CODEX_RPC_WS_VERSION}.tgz"
          "${RUNNER_TEMP}/go/bin/go" test -count=10 -race -v ./internal/nativequeue/owner
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 "${RUNNER_TEMP}/go/bin/go" test -c \
            -o "${RUNNER_TEMP}/owner-darwin-arm64.test" ./internal/nativequeue/owner
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 "${RUNNER_TEMP}/go/bin/go" test -c \
            -o "${RUNNER_TEMP}/owner-darwin-amd64.test" ./internal/nativequeue/owner
