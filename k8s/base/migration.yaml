apiVersion: batch/v1
kind: Job
metadata:
  name: agentboard-migrate
  labels:
    app.kubernetes.io/name: agentboard
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentboard
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: agentboard
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: agentboard-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.carverauto.dev/agentboard/dashboard:build-required
          command: ["/app/bin/agentboard", "eval", "Agentboard.Release.migrate()"]
          envFrom:
            - configMapRef:
                name: agentboard-config
          env:
            - name: PHX_SERVER
              value: "false"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: agentboard-db-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentboard-db-credentials
                  key: password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: agentboard-app
                  key: secret-key-base
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentboard-app
                  key: database-url
                  optional: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-ca
              mountPath: /etc/agentboard/db-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-ca
          secret:
            secretName: agentboard-db-ca
            items:
              - key: ca.crt
                path: ca.crt
