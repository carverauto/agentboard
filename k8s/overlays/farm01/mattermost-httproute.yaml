# Mattermost uses the shared wildcard listeners (`https`/`http`, *.k8s-farm,
# farm01-wildcard-tls, wildcard DNS to the Gateway). A dedicated
# mattermost.farm01.carverauto.dev host would need a companion GitOps edge
# change like carverauto/gitops#152 (listeners, Certificate, DNS01 solver,
# external-dns filter).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mattermost-https
  labels:
    app.kubernetes.io/name: mattermost
spec:
  parentRefs:
    - name: farm01-gateway
      namespace: farm01-edge
      sectionName: https
  hostnames:
    - mattermost.k8s-farm.carverauto.dev
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v4/websocket
      # Websockets are long-lived; ordinary requests keep the Gateway default.
      timeouts:
        request: 0s
      backendRefs:
        - name: mattermost
          port: 8065
    - matches:
        - path:
            type: PathPrefix
            value: /api/v4/files
        - path:
            type: PathPrefix
            value: /api/v4/uploads
      # Large attachments can outlast the 15s default request timeout.
      timeouts:
        request: 600s
      backendRefs:
        - name: mattermost
          port: 8065
    - backendRefs:
        - name: mattermost
          port: 8065
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mattermost-http-redirect
  labels:
    app.kubernetes.io/name: mattermost
spec:
  parentRefs:
    - name: farm01-gateway
      namespace: farm01-edge
      sectionName: http
  hostnames:
    - mattermost.k8s-farm.carverauto.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
