apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentboard-https
  labels:
    app.kubernetes.io/name: agentboard
spec:
  parentRefs:
    - name: farm01-gateway
      namespace: farm01-edge
      sectionName: agentboard-https
  hostnames:
    - agentboard.farm01.carverauto.dev
  rules:
    - backendRefs:
        - name: agentboard-dashboard
          port: 4000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentboard-http-redirect
  labels:
    app.kubernetes.io/name: agentboard
spec:
  parentRefs:
    - name: farm01-gateway
      namespace: farm01-edge
      sectionName: agentboard-http
  hostnames:
    - agentboard.farm01.carverauto.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
