apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentboard
resources:
  - ../../base
  - httproute.yaml
patches:
  - target:
      kind: Cluster
      name: agentboard-db
    patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: local-path-cnpg
configMapGenerator:
  - name: agentboard-config
    behavior: merge
    literals:
      # Captain-confirmed hostname (2026-10-05).
      - PHX_HOST=agentboard.farm01.carverauto.dev
      - DATABASE_HOST=agentboard-db-rw.agentboard.svc.cluster.local
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: registry.carverauto.dev/agentboard/dashboard
    # Built and remotely verified; publication is a separate operator step.
    digest: sha256:213d5a68d1316fae4803fc77a5461024a3541743b0c98e8f630db3307d06f16b
