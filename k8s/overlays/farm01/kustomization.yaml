apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentboard
resources:
  - ../../base
  - httproute.yaml
  - mattermost-httproute.yaml
components:
  - ../../components/mattermost
patches:
  - target:
      kind: Cluster
      name: agentboard-db
    patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: local-path-cnpg
  - target:
      kind: PersistentVolumeClaim
      name: mattermost-data
    patch: |-
      # Retain keeps chat attachments if the claim is deleted.
      - op: add
        path: /spec/storageClassName
        value: local-path-cnpg
  - target:
      kind: ConfigMap
      name: mattermost-config
    patch: |-
      - op: replace
        path: /data/MM_SERVICESETTINGS_SITEURL
        value: https://mattermost.k8s-farm.carverauto.dev
      - op: replace
        path: /data/MM_DB_HOST
        value: agentboard-db-rw.agentboard.svc.cluster.local
configMapGenerator:
  - name: agentboard-config
    behavior: merge
    literals:
      # Captain-confirmed hostname (2026-10-05).
      - PHX_HOST=agentboard.farm01.carverauto.dev
      - DATABASE_HOST=agentboard-db-rw.agentboard.svc.cluster.local
generatorOptions:
  disableNameSuffixHash: true
images:
  # Argo CD Image Updater keeps this digest on the newest `latest` image that
  # the Container images workflow publishes from main (see
  # docs/deploy/reference-farm01.md). Seeded with the image running on farm01.
  - name: registry.carverauto.dev/agentboard/dashboard
    # Published and deployed from merged Tailwind PR18 (27a4f40).
    digest: sha256:ba8db918fbdd5e676dc328b051c68e2f6b996ba5f751b098cc5cfa3dc84463b2
