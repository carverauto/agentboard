apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentboard
resources:
  - ../../base
  - httproute.yaml
  - mattermost-httproute.yaml
components:
  - ../../components/mattermost
patches:
  - path: dashboard-mattermost.yaml
  - target:
      kind: Cluster
      name: agentboard-db
    patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: local-path-cnpg
  - target:
      kind: PersistentVolumeClaim
      name: mattermost-data
    patch: |-
      # Retain keeps chat attachments if the claim is deleted.
      - op: add
        path: /spec/storageClassName
        value: local-path-cnpg
  - target:
      kind: ConfigMap
      name: mattermost-config
    patch: |-
      - op: replace
        path: /data/MM_SERVICESETTINGS_SITEURL
        value: https://mattermost.k8s-farm.carverauto.dev
      - op: replace
        path: /data/MM_DB_HOST
        value: agentboard-db-rw.agentboard.svc.cluster.local
configMapGenerator:
  - name: agentboard-config
    behavior: merge
    literals:
      # Captain-confirmed hostname (2026-10-05).
      - AGENTBOARD_PR_DISCOVERY_ENABLED=false
      - AGENTBOARD_PR_OBSERVATION_ENABLED=false
      - AGENTBOARD_MATTERMOST_BRIDGE_ENABLED=false
      - AGENTBOARD_MATTERMOST_BASE_URL=https://mattermost.k8s-farm.carverauto.dev
      - AGENTBOARD_MATTERMOST_BOARD_CHANNEL_ID=5ujo4n8df3njxgxsso15zbi59a
      - AGENTBOARD_MATTERMOST_BOT_TOKEN_FILE=/etc/agentboard/mattermost/bot-token
      - AGENTBOARD_MATTERMOST_CA_FILE=/etc/ssl/certs/ca-certificates.crt
      - AGENTBOARD_PUBLIC_BOARD_URL=https://agentboard.farm01.carverauto.dev
      - PHX_HOST=agentboard.farm01.carverauto.dev
      - DATABASE_HOST=agentboard-db-rw.agentboard.svc.cluster.local
generatorOptions:
  disableNameSuffixHash: true
images:
  # Operator-managed immutable release pin; see docs/deploy/reference-farm01.md.
  - name: registry.carverauto.dev/agentboard/dashboard
    # Published from merged Mattermost bridge PR61 (21afca5).
    digest: sha256:a60886cdeb0a296782d29166150a593b64b52a135d5f2c3e7a8c54d98030c815
