apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentboard
resources:
  - ../../base
  - httproute.yaml
  - mattermost-httproute.yaml
components:
  - ../../components/mattermost
patches:
  - path: dashboard-mattermost.yaml
  - path: dashboard-github-token.yaml
  - target:
      kind: Cluster
      name: agentboard-db
    patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: local-path-cnpg
  - target:
      kind: PersistentVolumeClaim
      name: mattermost-data
    patch: |-
      # Retain keeps chat attachments if the claim is deleted.
      - op: add
        path: /spec/storageClassName
        value: local-path-cnpg
  - target:
      kind: ConfigMap
      name: mattermost-config
    patch: |-
      - op: replace
        path: /data/MM_SERVICESETTINGS_SITEURL
        value: https://mattermost.k8s-farm.carverauto.dev
      - op: replace
        path: /data/MM_DB_HOST
        value: agentboard-db-rw.agentboard.svc.cluster.local
configMapGenerator:
  - name: agentboard-config
    behavior: merge
    literals:
      # Captain-confirmed hostname (2026-10-05).
      - AGENTBOARD_PR_DISCOVERY_ENABLED=true
      - AGENTBOARD_PR_OBSERVATION_ENABLED=true
      # Captain-approved 2026-10-07: cooperation on after the #102 fix (PR111, live in
      # 1bf92ae) and a 30-minute clean-poll window. Roll back by setting false.
      - AGENTBOARD_COOPERATION_ENABLED=true
      # Captain-approved serviceradar required checks (identities from provider
      # evidence on PR 5516 head); skipped accepted for path-filtered checks.
      # Captain-approved 2026-10-07: carverauto/agentboard added (identities from
      # provider evidence on PR 121 head 4ff4929). lint/compose-smoke are
      # workflow-path-filtered, so docs/k8s-only PRs stay policy_unknown (fail
      # closed). Roll back by removing the carverauto/agentboard entry.
      - 'AGENTBOARD_CI_POLICIES={"carverauto/serviceradar":{"tested_ref":"head","required":["status:BazelCI","check:15368:lint","check:15368:gitleaks","check:46505:GitGuardian Security Checks","status:license/cla"],"accepted_conclusions":["success","skipped"]},"carverauto/agentboard":{"tested_ref":"head","required":["check:15368:lint","check:15368:compose-smoke","check:46505:GitGuardian Security Checks"],"accepted_conclusions":["success","skipped"]}}'
      # Captain-approved 2026-10-07: outbound bridge on (TLS fix 7dfd031).
      - AGENTBOARD_MATTERMOST_BRIDGE_ENABLED=true
      - AGENTBOARD_MATTERMOST_BASE_URL=https://mattermost.k8s-farm.carverauto.dev
      - AGENTBOARD_MATTERMOST_BOARD_CHANNEL_ID=5ujo4n8df3njxgxsso15zbi59a
      - AGENTBOARD_MATTERMOST_BOT_TOKEN_FILE=/etc/agentboard/mattermost/bot-token
      - AGENTBOARD_MATTERMOST_CA_FILE=/etc/ssl/certs/ca-certificates.crt
      # Captain-approved 2026-10-07: team of the #board channel (Carver Automation
      # Corporation); enables the identity team-membership check.
      - AGENTBOARD_MATTERMOST_TEAM_ID=5b1bxk4xmjre7kkxbjmqpt7muc
      - AGENTBOARD_PUBLIC_BOARD_URL=https://agentboard.farm01.carverauto.dev
      - PHX_HOST=agentboard.farm01.carverauto.dev
      - DATABASE_HOST=agentboard-db-rw.agentboard.svc.cluster.local
generatorOptions:
  disableNameSuffixHash: true
images:
  # Operator-managed immutable release pin; see docs/deploy/reference-farm01.md.
  - name: registry.carverauto.dev/agentboard/dashboard
    # Published from merged main 1bf92ae (PR113 on PR111 base-fence fix, PR112, PR95 availability; schema 15).
    digest: sha256:a71479ebe17c6fa6d5ece1a78e7226886ed739eb04a6bd4e783a48c3b0426a8c
